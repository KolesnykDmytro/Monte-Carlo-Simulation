<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop challenge simulator · loader demo</title>
<!--
  Monte Carlo loader
  ==================
  A ~2.8 s page loader that is itself a small Monte Carlo simulation of a
  prop-firm challenge. Every number on screen is computed from the runs drawn:
  P(pass) = passed / runs, with a 95% Wilson score interval.

  To use it on your site, copy three blocks:
    1. <style id="mc-loader-css">   -> into <head>
    2. <div id="mc-loader">          -> first thing inside <body>
    3. <script id="mc-loader-js">    -> right after that div
  Everything else in this file is the demo page behind the loader.

  API
    MCLoader.config            parameters (edit before load, or before replay)
    MCLoader.replay()          run the loader again (in manual mode, call done() again)
    MCLoader.done()            with config.waitFor = 'manual': hide when you're ready
    window 'mcloader:done'     event with { runs, passed, failed, unfinished }
-->
<noscript><style>#mc-loader{display:none!important}</style></noscript>

<style id="mc-loader-css">
#mc-loader {
  /* Outcome colours are Okabe-Ito bluish green / vermillion: checked for
     colour-blind separation on this surface. Text stays in neutral inks. */
  --mc-surface: #0e1624;
  --mc-ink: #e9eef5;
  --mc-ink-2: #a3afc0;
  --mc-ink-3: #7d8ba1;
  --mc-grid: #1a2433;
  --mc-axis: #2b3749;
  --mc-live: #c9d4e3;
  --mc-pass: #009e73;
  --mc-fail: #d55e00;
  --mc-open: #5b6b82;
  --mc-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; /* set to your site's font */

  position: fixed;
  inset: 0;
  z-index: 2147483000;
  display: grid;
  place-items: center;
  padding: 24px 0;
  background: var(--mc-surface);
  color: var(--mc-ink);
  font: 400 14px/1.4 var(--mc-font);
  -webkit-font-smoothing: antialiased;
  transition: opacity .4s ease;
  animation: mc-failsafe 0s linear 10s forwards; /* if the script never runs, step aside after 10 s */
}
#mc-loader.mc-js { animation: none; }
#mc-loader.mc-hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .4s ease, visibility 0s linear .4s;
}
@keyframes mc-failsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }
html.mc-lock { overflow: hidden; }

#mc-loader .mc-sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
#mc-loader .mc-stage {
  width: min(720px, 92vw, calc((100vh - 230px) * 2));
  min-width: 280px;
}
@supports (height: 100dvh) {
  #mc-loader .mc-stage { width: min(720px, 92vw, calc((100dvh - 230px) * 2)); }
}
#mc-loader .mc-status { margin: 0 0 12px; font-size: 13px; color: var(--mc-ink-2); }
#mc-loader .mc-chart { display: block; width: 100%; aspect-ratio: 2 / 1; }

#mc-loader .mc-readout {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
  gap: 12px 24px; margin-top: 16px;
}
#mc-loader .mc-value {
  display: block; font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; /* the value changes every frame: fixed-width digits stop it jittering */
}
#mc-loader .mc-caption { display: block; margin-top: 6px; font-size: 13px; color: var(--mc-ink-2); }
#mc-loader .mc-meta {
  display: grid; grid-template-columns: auto auto; gap: 4px 12px; margin: 0;
  font-size: 13px; text-align: right;
}
#mc-loader .mc-meta dt { color: var(--mc-ink-3); }
#mc-loader .mc-meta dd { margin: 0; font-variant-numeric: tabular-nums; }

#mc-loader .mc-bar { display: flex; gap: 2px; height: 4px; margin-top: 16px; }
#mc-loader .mc-bar i { display: block; height: 100%; width: 0; border-radius: 2px; transition: width .15s linear; }
#mc-loader .mc-bar .mc-track { flex: 1 1 auto; background: var(--mc-grid); transition: none; }

#mc-loader .mc-legend {
  display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 12px 0 0; padding: 0; list-style: none;
  font-size: 12.5px; color: var(--mc-ink-2);
}
#mc-loader .mc-legend li { display: flex; align-items: center; }
#mc-loader .mc-legend b { margin-left: 6px; font-weight: 500; color: var(--mc-ink); font-variant-numeric: tabular-nums; }
#mc-loader .mc-key { display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 2px; }
#mc-loader .mc-pass { background: var(--mc-pass); }
#mc-loader .mc-fail { background: var(--mc-fail); }
#mc-loader .mc-open { background: var(--mc-open); }

@media (max-width: 480px) {
  #mc-loader .mc-chart { aspect-ratio: 16 / 10; }
  #mc-loader .mc-value { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  #mc-loader, #mc-loader.mc-hide { transition-duration: .15s; }
  #mc-loader .mc-bar i { transition: none; }
}
</style>

<style>
/* ---- demo page only (not part of the loader) ---- */
html { color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: #0e1624; color: #e9eef5;
  font: 400 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.demo { width: min(560px, 88vw); }
.demo h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; font-weight: 600; }
.demo p { margin: 0 0 24px; color: #a3afc0; }
.demo .demo-last { margin: 20px 0 0; font-size: 14px; color: #7d8ba1; min-height: 1.55em; }
.demo button {
  font: inherit; font-size: 15px; color: #e9eef5; background: transparent;
  border: 1px solid #2b3749; border-radius: 8px; padding: 10px 16px; cursor: pointer;
}
.demo button:hover { border-color: #7d8ba1; }
.demo button:focus-visible { outline: 2px solid #c9d4e3; outline-offset: 2px; }
</style>
</head>
<body>

<div id="mc-loader" aria-busy="true">
  <p class="mc-sr" role="status" data-mc="sr">Loading</p>
  <div class="mc-stage" aria-hidden="true">
    <p class="mc-status" data-mc="status">Simulating challenge runs</p>
    <canvas class="mc-chart"></canvas>
    <div class="mc-readout">
      <div>
        <span class="mc-value" data-mc="p">–</span>
        <span class="mc-caption">chance to pass within <span data-mc="trades">60</span> trades</span>
      </div>
      <dl class="mc-meta">
        <dt>95% CI</dt><dd data-mc="ci">–</dd>
        <dt>Runs</dt><dd data-mc="n">0</dd>
      </dl>
    </div>
    <div class="mc-bar">
      <i class="mc-pass" data-mc="bar-pass"></i><i class="mc-fail" data-mc="bar-fail"></i><i class="mc-open" data-mc="bar-open"></i><i class="mc-track" data-mc="bar-track"></i>
    </div>
    <ul class="mc-legend">
      <li><i class="mc-key mc-pass"></i>Passed<b data-mc="c-pass">0</b></li>
      <li><i class="mc-key mc-fail"></i>Failed<b data-mc="c-fail">0</b></li>
      <li><i class="mc-key mc-open"></i>Unfinished<b data-mc="c-open">0</b></li>
    </ul>
  </div>
</div>

<script id="mc-loader-js">
(function () {
  'use strict';

  /* ---- Parameters ----------------------------------------------------------
     Demo strategy: 40% win rate, wins of 1.3–2.5R, losses of 1R.
     A run passes when equity reaches +10R before it falls to −8R, within 60 trades.
     A 400,000-run Python check of these values gave ≈61.7% passed, 18.2% failed,
     20.1% unfinished; one batch of 180 shows a noisy estimate of that.
     These are illustrative values, not any prop firm's rules. */
  var CFG = {
    runs: 180,            // runs per batch (x0.65 on narrow screens)
    trades: 60,           // trades per run: the x axis
    winRate: 0.40,        // probability that a trade wins
    winR: [1.3, 2.5],     // a win is uniform in this range, in R
    lossR: 1,             // a loss, in R
    targetR: 10,          // upper barrier: the run passes
    maxLossR: 8,          // lower barrier: the run fails
    launch: [200, 1450],  // ms window in which runs start
    runMs: 650,           // ms for a run to cross all trades
    minMs: 2150,          // keep the loader at least this long
    holdMs: 300,          // pause on the final numbers before fading
    maxMs: 8000,          // never cover the page longer than this
    waitFor: 'load',      // 'load', or 'manual' (then call MCLoader.done())
    seed: null            // a number replays the same simulation every time
  };

  var NB = 20, TAU = Math.PI * 2;
  var root, canvas, ctx, layer, lctx, el = {}, col = {};
  var W = 1, H = 1, dpr = 1, G = {};
  var rand, queue = [], settled = [], pulses = [], bins, binH, cnt, batch = 1, batchSize = 0;
  var t0 = 0, lastT = 0, raf = 0, exitAt = -1, manualDone = false, shownDone = false, reduced = false, dirty = true, resizeTimer = 0;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function zeros(n) { var a = []; while (n--) a.push(0); return a; }
  function crisp(v) { return Math.round(v) + 0.5; }

  // mulberry32: small seedable PRNG, so a run can be replayed exactly
  function mulberry32(a) {
    return function () {
      var t = a = (a + 0x6D2B79F5) | 0;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---- Simulation ----------------------------------------------------------- */
  // One challenge: equity in R after each trade. A run stops at the barrier it
  // touches; endX is the fractional trade index where the line meets it.
  function simulateRun() {
    var pts = [0], eq = 0, k, step, next;
    for (k = 1; k <= CFG.trades; k++) {
      step = rand() < CFG.winRate ? CFG.winR[0] + (CFG.winR[1] - CFG.winR[0]) * rand() : -CFG.lossR;
      next = eq + step;
      if (next >= CFG.targetR) {
        pts.push(CFG.targetR);
        return { pts: pts, endX: k - 1 + (CFG.targetR - eq) / step, outcome: 1 };
      }
      if (next <= -CFG.maxLossR) {
        pts.push(-CFG.maxLossR);
        return { pts: pts, endX: k - 1 + (-CFG.maxLossR - eq) / step, outcome: -1 };
      }
      eq = next;
      pts.push(eq);
    }
    return { pts: pts, endX: CFG.trades, outcome: 0 };
  }

  function newBatch(offset) {
    var list = [], a = CFG.launch[0], span = CFG.launch[1] - CFG.launch[0], i, r;
    for (i = 0; i < batchSize; i++) {
      r = simulateRun();
      r.start = offset + a + span * (i + rand()) / batchSize; // evenly spread, jittered
      r.end = r.start + CFG.runMs * r.endX / CFG.trades;
      list.push(r);
    }
    return list;
  }

  // 95% Wilson score interval for k successes out of n
  function wilson(k, n) {
    var z = 1.959964, z2 = z * z, p = k / n, d = 1 + z2 / n;
    var c = (p + z2 / (2 * n)) / d;
    var h = (z / d) * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n));
    return [Math.max(0, c - h), Math.min(1, c + h)];
  }

  /* ---- Geometry ------------------------------------------------------------- */
  function measure() {
    var r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = layer.width = Math.round(W * dpr);
    canvas.height = layer.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    G.hist = clamp(H * 0.15, 16, 46);           // room for the hit-time columns
    G.l = 4; G.r = W - 4;
    G.top = G.hist + 6; G.bot = H - G.hist - 6;
    G.sx = (G.r - G.l) / CFG.trades;
    G.sy = (G.bot - G.top) / (CFG.targetR + CFG.maxLossR);
    G.y0 = G.top + CFG.targetR * G.sy;
    G.fs = W < 440 ? 10 : 11;
  }
  function X(x) { return G.l + x * G.sx; }
  function Y(v) { return G.y0 - v * G.sy; }

  function readColors() {
    var cs = getComputedStyle(root);
    ['surface', 'ink', 'ink-2', 'ink-3', 'grid', 'axis', 'live', 'pass', 'fail', 'open'].forEach(function (k) {
      col[k] = cs.getPropertyValue('--mc-' + k).trim();
    });
    col.font = cs.getPropertyValue('--mc-font').trim() || 'sans-serif';
  }

  /* ---- Drawing -------------------------------------------------------------- */
  function valueAt(r, x) {
    var last = r.pts.length - 1, j, x1;
    if (x >= r.endX) return r.pts[last];
    j = Math.floor(x);
    x1 = j + 1 >= last ? r.endX : j + 1;
    return r.pts[j] + (r.pts[j + 1] - r.pts[j]) * ((x - j) / (x1 - j));
  }
  // add the run's polyline between trade positions a and b to the current path
  function trace(c, r, a, b) {
    var last = r.pts.length - 1, j;
    c.moveTo(X(a), Y(valueAt(r, a)));
    for (j = Math.floor(a) + 1; j < last && j < b; j++) c.lineTo(X(j), Y(r.pts[j]));
    c.lineTo(X(b), Y(valueAt(r, b)));
  }

  function paintSettled(r) {
    lctx.beginPath();
    trace(lctx, r, 0, r.endX);
    lctx.lineWidth = 1;
    lctx.lineJoin = 'round';
    lctx.strokeStyle = r.outcome > 0 ? col.pass : r.outcome < 0 ? col.fail : col.open;
    lctx.globalAlpha = r.outcome > 0 ? 0.3 : r.outcome < 0 ? 0.46 : 0.45;
    lctx.stroke();
    lctx.globalAlpha = 1;
  }

  function barrier(y, color, k) {
    var yy = crisp(y);
    ctx.save();
    ctx.globalAlpha = 0.9 * k;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(X(0), yy); ctx.lineTo(X(0) + (G.r - X(0)) * k, yy); ctx.stroke();
    ctx.restore();
  }

  // barrier name, drawn last with a surface-coloured halo so crossing lines don't hide it
  function label(text, y, side, k) {
    var x = X(0) + 8, ty = y + side * 6;
    ctx.save();
    ctx.globalAlpha = k;
    ctx.font = '500 ' + G.fs + 'px ' + col.font;
    ctx.textBaseline = side > 0 ? 'top' : 'bottom';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = col.surface;
    ctx.strokeText(text, x, ty);
    ctx.fillStyle = col['ink-3'];
    ctx.fillText(text, x, ty);
    ctx.restore();
  }

  function column(x, y, w, h, color, up) {
    var rad = Math.max(0, Math.min(3, w / 2, h));
    ctx.fillStyle = color;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, up ? [rad, rad, 0, 0] : [0, 0, rad, rad]);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  // where along the trade axis runs hit each barrier: columns grow as runs land
  function histograms(dt) {
    var maxC = 1, i, x, unit, bw, w, ease, yT, yD;
    for (i = 0; i < NB; i++) maxC = Math.max(maxC, bins.pass[i], bins.fail[i]);
    unit = Math.min(3, (G.hist - 4) / maxC);
    bw = (G.r - G.l) / NB;
    w = Math.max(2, Math.min(14, bw * 0.42));
    ease = reduced ? 1 : 1 - Math.exp(-dt / 90);
    yT = crisp(Y(CFG.targetR));
    yD = crisp(Y(-CFG.maxLossR));
    ctx.globalAlpha = 0.9;
    for (i = 0; i < NB; i++) {
      binH.pass[i] += (bins.pass[i] * unit - binH.pass[i]) * ease;
      binH.fail[i] += (bins.fail[i] * unit - binH.fail[i]) * ease;
      x = G.l + i * bw + (bw - w) / 2;
      if (binH.pass[i] > 0.5) column(x, yT - 3 - binH.pass[i], w, binH.pass[i], col.pass, true);
      if (binH.fail[i] > 0.5) column(x, yD + 3, w, binH.fail[i], col.fail, false);
    }
    ctx.globalAlpha = 1;
  }

  function draw(t, dt) {
    var k = reduced ? 1 : easeOut(clamp(t / 450, 0, 1)), i, r, p, e, hx, hy, live = 0;
    ctx.clearRect(0, 0, W, H);

    // hairline grid every 10 trades + start-equity baseline
    ctx.globalAlpha = k;
    ctx.lineWidth = 1;
    ctx.strokeStyle = col.grid;
    ctx.beginPath();
    for (i = 10; i < CFG.trades; i += 10) { hx = crisp(X(i)); ctx.moveTo(hx, G.top); ctx.lineTo(hx, G.bot); }
    ctx.stroke();
    ctx.strokeStyle = col.axis;
    ctx.beginPath(); ctx.moveTo(X(0), crisp(Y(0))); ctx.lineTo(X(0) + (G.r - X(0)) * k, crisp(Y(0))); ctx.stroke();
    ctx.globalAlpha = 1;

    barrier(Y(CFG.targetR), col.pass, k);
    barrier(Y(-CFG.maxLossR), col.fail, k);

    ctx.drawImage(layer, 0, 0, W, H);   // finished runs
    histograms(dt);

    // runs in flight: neutral until they reach an outcome
    ctx.beginPath();
    for (i = 0; i < queue.length; i++) {
      r = queue[i];
      if (t < r.start) continue;
      r.upto = Math.min(r.endX, (t - r.start) / CFG.runMs * CFG.trades);
      trace(ctx, r, 0, r.upto);
      live++;
    }
    if (live) {
      ctx.lineWidth = 1; ctx.lineJoin = 'round'; ctx.strokeStyle = col.live;
      ctx.globalAlpha = 0.32; ctx.stroke();
      ctx.beginPath();
      for (i = 0; i < queue.length; i++) {
        r = queue[i];
        if (t >= r.start) trace(ctx, r, Math.max(0, r.upto - 4), r.upto);
      }
      ctx.globalAlpha = 0.95; ctx.stroke();
      ctx.beginPath();
      for (i = 0; i < queue.length; i++) {
        r = queue[i];
        if (t < r.start) continue;
        hx = X(r.upto); hy = Y(valueAt(r, r.upto));
        ctx.moveTo(hx + 1.6, hy); ctx.arc(hx, hy, 1.6, 0, TAU);
      }
      ctx.globalAlpha = 1; ctx.fillStyle = col.ink; ctx.fill();
    }

    // a brief ring where a run hits a barrier
    for (i = pulses.length - 1; i >= 0; i--) {
      p = pulses[i];
      e = (t - p.t) / 320;
      if (e >= 1) { pulses.splice(i, 1); continue; }
      ctx.globalAlpha = 0.6 * (1 - e);
      ctx.strokeStyle = p.c; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.v), 2 + (W < 440 ? 3.5 : 5) * easeOut(e), 0, TAU); ctx.stroke();
    }

    // common starting point
    ctx.globalAlpha = k;
    ctx.fillStyle = col.ink;
    ctx.beginPath(); ctx.arc(X(0), Y(0), 2.5, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    label('Target +' + CFG.targetR + 'R', Y(CFG.targetR), 1, k);
    label('Max loss −' + CFG.maxLossR + 'R', Y(-CFG.maxLossR), -1, k);
  }

  /* ---- Read-out ------------------------------------------------------------- */
  function seg(node, f) {
    node.style.display = f > 0 ? '' : 'none';
    node.style.width = 'max(0px, calc(' + (100 * f).toFixed(3) + '% - 2px))';
  }
  function readout() {
    if (!dirty) return;
    dirty = false;
    var n = cnt.n, p, ci, fill;
    el.status.textContent = shownDone ? 'Simulated ' + n.toLocaleString('en-US') + ' challenge runs'
      : batch === 1 ? 'Simulating ' + batchSize + ' challenge runs'
      : 'Simulating more runs while the page loads';
    el.n.textContent = batch === 1 ? n + ' of ' + batchSize : n.toLocaleString('en-US');
    el.cPass.textContent = cnt.pass;
    el.cFail.textContent = cnt.fail;
    el.cOpen.textContent = cnt.open;
    if (!n) {
      el.p.textContent = '–'; el.ci.textContent = '–';
      seg(el.bPass, 0); seg(el.bFail, 0); seg(el.bOpen, 0); el.bTrack.style.display = '';
      return;
    }
    p = cnt.pass / n;
    ci = wilson(cnt.pass, n);
    el.p.textContent = (100 * p).toFixed(1) + '%';
    el.ci.textContent = (100 * ci[0]).toFixed(1) + '–' + (100 * ci[1]).toFixed(1) + '%';
    fill = Math.min(1, n / batchSize);
    seg(el.bPass, fill * cnt.pass / n);
    seg(el.bFail, fill * cnt.fail / n);
    seg(el.bOpen, fill * cnt.open / n);
    el.bTrack.style.display = fill >= 1 ? 'none' : '';
  }

  /* ---- Lifecycle ------------------------------------------------------------ */
  function binOf(x) { return Math.min(NB - 1, Math.floor(x / CFG.trades * NB)); }

  function settle(r, t) {
    r.done = true;
    paintSettled(r);
    settled.push(r);
    cnt.n++;
    if (r.outcome > 0) { cnt.pass++; bins.pass[binOf(r.endX)]++; }
    else if (r.outcome < 0) { cnt.fail++; bins.fail[binOf(r.endX)]++; }
    else cnt.open++;
    if (r.outcome && !reduced) {
      pulses.push({ x: r.endX, v: r.outcome > 0 ? CFG.targetR : -CFG.maxLossR, c: r.outcome > 0 ? col.pass : col.fail, t: t });
    }
    dirty = true;
  }

  function isReady() { return CFG.waitFor === 'manual' ? manualDone : document.readyState === 'complete'; }
  function minDuration() { return reduced ? 600 : CFG.minMs; }

  // page still loading after a full batch: keep sampling, the interval keeps narrowing
  function nextBatch(t) {
    batch++;
    lctx.save();
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = 'destination-out';
    lctx.fillStyle = 'rgba(0,0,0,0.6)';
    lctx.fillRect(0, 0, layer.width, layer.height);
    lctx.restore();
    settled = [];
    queue = newBatch(t - CFG.launch[0]);
    dirty = true;
  }

  function markDone(t) {
    for (var i = queue.length - 1; i >= 0; i--) if (t < queue[i].start) queue.splice(i, 1); // launch nothing new
    shownDone = true;
    root.classList.add('mc-ready');
    el.sr.textContent = 'Loaded';
    dirty = true;
  }

  function finish() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    root.classList.add('mc-hide');
    root.setAttribute('aria-busy', 'false');
    document.documentElement.classList.remove('mc-lock');
    try {
      window.dispatchEvent(new CustomEvent('mcloader:done', {
        detail: { runs: cnt.n, passed: cnt.pass, failed: cnt.fail, unfinished: cnt.open }
      }));
    } catch (e) { /* no CustomEvent constructor: skip the event */ }
  }

  function update(t) {
    var ready = isReady(), i, r;
    for (i = queue.length - 1; i >= 0; i--) {
      r = queue[i];
      if (t >= r.end) { settle(r, t); queue.splice(i, 1); }
      else if (ready && batch > 1 && t < r.start) queue.splice(i, 1); // page is ready: skip runs not started
    }
    if (exitAt < 0) {
      if (t >= CFG.maxMs || (!queue.length && ready && t >= minDuration())) {
        exitAt = t + CFG.holdMs;
        markDone(t);
      } else if (!queue.length && !ready) {
        nextBatch(t);
      }
    } else if (t >= exitAt) {
      finish();
    }
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    try {
      var t = Math.max(0, now - t0), dt = Math.max(0, Math.min(64, t - lastT));
      lastT = t;
      update(t);
      if (raf) { draw(t, dt); readout(); }
    } catch (err) {
      if (window.console) console.error('[MCLoader]', err);
      finish();
    }
  }

  function start() {
    var i;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    root.classList.remove('mc-hide', 'mc-ready');
    root.classList.add('mc-js');
    root.setAttribute('aria-busy', 'true');
    document.documentElement.classList.add('mc-lock');
    readColors();
    measure();
    batchSize = Math.max(40, Math.round(CFG.runs * (W < 440 ? 0.65 : 1)));
    rand = mulberry32(CFG.seed == null ? (Math.random() * 4294967296) >>> 0 : CFG.seed >>> 0);
    cnt = { n: 0, pass: 0, fail: 0, open: 0 };
    bins = { pass: zeros(NB), fail: zeros(NB) };
    binH = { pass: zeros(NB), fail: zeros(NB) };
    pulses = []; settled = []; batch = 1; exitAt = -1; dirty = true; manualDone = false; shownDone = false;
    lctx.clearRect(0, 0, W, H);
    el.trades.textContent = CFG.trades;
    el.sr.textContent = 'Loading';
    queue = newBatch(0);
    if (reduced) {                       // no motion: show the finished simulation at once
      for (i = 0; i < queue.length; i++) settle(queue[i], 0);
      queue = [];
      draw(0, 16);
    }
    readout();
    t0 = performance.now();
    lastT = 0;
    raf = requestAnimationFrame(frame);
  }

  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (!raf) return;                  // loader already gone
      measure();
      lctx.clearRect(0, 0, W, H);
      for (var i = 0; i < settled.length; i++) paintSettled(settled[i]);
    }, 120);
  }

  function q(name) { return root.querySelector('[data-mc="' + name + '"]'); }

  function init() {
    root = document.getElementById('mc-loader');
    if (!root) return;
    try {
      canvas = root.querySelector('canvas');
      ctx = canvas.getContext('2d');
      layer = document.createElement('canvas');
      lctx = layer.getContext('2d');
      el = {
        sr: q('sr'), status: q('status'), p: q('p'), ci: q('ci'), n: q('n'), trades: q('trades'),
        cPass: q('c-pass'), cFail: q('c-fail'), cOpen: q('c-open'),
        bPass: q('bar-pass'), bFail: q('bar-fail'), bOpen: q('bar-open'), bTrack: q('bar-track')
      };
      window.addEventListener('resize', onResize);
      start();
    } catch (err) {
      if (window.console) console.error('[MCLoader]', err);
      root.classList.add('mc-hide');
      document.documentElement.classList.remove('mc-lock');
    }
  }

  window.MCLoader = {
    config: CFG,
    replay: function () { if (root) start(); },
    done: function () { manualDone = true; }
  };

  if (document.getElementById('mc-loader')) init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>

  <h1>Prop challenge simulator</h1>
  <p>This page stands in for your site. The loader covers it until the page has loaded and the first batch of runs has finished, about 2.8 seconds.</p>
  <button type="button" id="replay">Replay loader</button>
  <p class="demo-last" id="last"></p>
</main>
<script>
  document.getElementById('replay').addEventListener('click', function () { MCLoader.replay(); });
  window.addEventListener('mcloader:done', function (e) {
    var d = e.detail;
    document.getElementById('last').textContent =
      'Last run: ' + d.passed + ' passed, ' + d.failed + ' failed, ' + d.unfinished + ' unfinished out of ' + d.runs + '.';
  });
</script>
